services:
  pia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pia
    ports:
      - "8000:8000"
    environment:
      - PIA_DEPENDENCY_TRACK_API_KEY=${PIA_DEPENDENCY_TRACK_API_KEY:-test-api-key}
      - PIA_DATABASE_URL=postgresql://pia:pia@postgres:5432/pia
      - PIA_EXPECTED_AUDIENCE=${PIA_EXPECTED_AUDIENCE:-pia.eclipse.org}
      - PIA_DEPENDENCY_TRACK_URL=${PIA_DEPENDENCY_TRACK_URL:-https://sbom.eclipse.org/api/v1/bom}
    volumes:
      - ./pia:/app/pia:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./alembic:/app/alembic:ro
      - ./alembic/versions:/app/alembic/versions:Z
    depends_on:
      postgres:
        condition: service_healthy
    # Dev-only convenience: chaining "alembic upgrade head" with the app start
    # is fine for this single-container dev setup. In production migrations are
    # run as a separate step (e.g. a Helm pre-upgrade hook job), not on app
    # startup, to avoid replicas racing to migrate.
    command: ["sh", "-c", "alembic upgrade head && uvicorn pia.main:app --host 0.0.0.0 --port 8000 --reload"]
  postgres:
    image: postgres:18-alpine
    container_name: pia-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pia
      POSTGRES_PASSWORD: pia
      POSTGRES_DB: pia
    volumes:
      - pia-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pia -d pia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pia-postgres-data:
