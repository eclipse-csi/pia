name: Publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Primary image tag, e.g. '0.6.0' for tag v0.6.0, 'dev' on main.
      version: ${{ steps.meta.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # Full history incl. origin/main, for the release tag check below.
        # Size difference to a shallow fetch is negligible (~770 vs ~210 KiB
        # packed, as of Nov 2026).
        fetch-depth: 0

    - name: Verify release tag is on main
      if: startsWith(github.ref, 'refs/tags/')
      env:
        TAG: ${{ github.ref_name }}
      run: |
        # Refuse to publish a release from a commit that isn't (yet) part of
        # main.
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "::error::${TAG} points to $(git rev-parse HEAD), which is not on main. Merge first, then re-tag."
          echo "To delete the tag, temporarily disable the pia tag protection in eclipse-csi/.eclipsefdn."
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=dev,enable={{is_default_branch}}
          type=sha,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  # Releases only: 'dev' and 'sha-*' images from main are not tracked in
  # DependencyTrack. sbom.yml stays separately dispatchable for backfills.
  sbom:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    uses: $/.github/workflows/sbom.yml
    with:
      version: ${{ needs.build-and-push.outputs.version }}
