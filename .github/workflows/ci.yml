name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check Python version alignment
      run: |
        # Dev/CI Python (.python-version) and released Python (Dockerfile)
        # must share the same minor version; patch drift is fine.
        want="$(cat .python-version)"
        found=0
        for got in $(sed -nE 's/^FROM python:([0-9]+\.[0-9]+)\..*/\1/p' Dockerfile); do
          found=1
          if [ "$got" != "$want" ]; then
            echo "Dockerfile uses Python $got, .python-version says $want"
            exit 1
          fi
        done
        if [ "$found" = 0 ]; then
          echo "No 'FROM python:X.Y.Z' line found in Dockerfile"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install dependencies (fails if uv.lock is out of sync)
      run: uv sync --locked --all-extras

    - name: Run linter
      run: make lint

    - name: Run tests
      run: make test-verbose

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Both smoke-test steps below need a reachable database: one runs
      # "alembic upgrade head" via the image, the other starts the app.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pia
          POSTGRES_PASSWORD: pia
          POSTGRES_DB: pia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pia -d pia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and load image for testing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: ${{ env.IMAGE_NAME }}:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run database migrations
      run: |
        # Mirrors the production Helm pre-upgrade hook: run "alembic upgrade
        # head" via the image to verify the migration scripts apply cleanly.
        # --network host so the container reaches the postgres service at
        # localhost:5432 (the service port is published on the runner host).
        docker run --rm \
          --network host \
          -e PIA_DATABASE_URL=postgresql://pia:pia@localhost:5432/pia \
          ${IMAGE_NAME}:test \
          alembic upgrade head

    - name: Run Docker container
      run: |
        # Default CMD (uvicorn, no migration). --network host so the app is
        # reachable at localhost:8000 directly.
        docker run -d \
          --name pia-test \
          --network host \
          -e PIA_DEPENDENCY_TRACK_API_KEY=test-key \
          -e PIA_DATABASE_URL=postgresql://pia:pia@localhost:5432/pia \
          ${IMAGE_NAME}:test

    - name: Test API response
      run: |
        if ! timeout 30 bash -c 'until curl -fs http://localhost:8000/livez >/dev/null; do sleep 1; done'; then
          echo "API did not become healthy within 30s"
          docker logs pia-test
          exit 1
        fi
        echo "API test passed: /livez responded"

        if ! curl -fs http://localhost:8000/metrics | grep -q '^pia_build_info'; then
          echo "/metrics did not expose pia_build_info"
          docker logs pia-test
          exit 1
        fi
        echo "API test passed: /metrics responded"

    - name: Clean up
      run: |
        docker stop pia-test || true
        docker rm pia-test || true
