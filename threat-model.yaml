# threat-model.yaml — derived index; the prose threat model is canonical.
schema: threat-model-sidecar/v2
project: pia
prose_version: "threat-model.md@sha256:59b92e860fbf1cc66a791c8467f536f19e19e087def3134da30ffed5384dd9bb"
model_status: accepted
triage_policy: strict
confidence: {documented: 183, maintainer: 48, inferred: 0, assumption: 0}

generation:
  model: "Claude Fable 5.1 (claude-fable-5-1); GitLab revision 2026-11-10 and sanitization revision 2026-11-11: Claude Opus 5.5 (claude-opus-5-5)"
  effort: "medium; GitLab revision: low"
  plugins:
    - threat-model
    - threat-model-recon
    - threat-model-surface
    - threat-model-interview
    - threat-model-authoring
    - threat-model-backtest
    - threat-model-sidecar

components:
  - name: auth
    scope: in
    reachability_precondition: "reachable from the Authorization header of an unauthenticated request, or from an allowlisted issuer's HTTP response"
    provenance: {kind: documented, source: "DESIGN.md §3.1.1"}
  - name: upload-relay
    scope: in
    reachability_precondition: "reachable from the body of a request whose token verified for a registered workload, or from a DependencyTrack response"
    provenance: {kind: documented, source: "DESIGN.md §3.1 steps 5–6"}
  - name: ops-endpoints
    scope: in
    reachability_precondition: "reachable from any HTTP request to the pod, including unmatched routes and unknown methods"
    provenance: {kind: documented, source: "DESIGN.md §5.4 Label cardinality"}
  - name: operator-tooling
    scope: in
    reachability_precondition: "reachable from the curated file, the PIA_* environment, or a GitHub, Eclipse GitLab or DependencyTrack API response; all operator trust"
    provenance: {kind: documented, source: "DESIGN.md §5.5 human-curated file"}
  - name: dev-bootstrap-script
    scope: out
    reason: "scripts/dt_bootstrap.py targets the local docker-compose DependencyTrack only, per §1.3"
    provenance: {kind: documented, source: "scripts/dt_bootstrap.py docstring"}
  - name: dev-compose-stack
    scope: out
    reason: "docker-compose.yml and projects.local.yaml are dev-only, per §1.3"
    provenance: {kind: documented, source: "docker-compose.yml Dev-only convenience comment"}
  - name: tests
    scope: out
    reason: "tests/ is not shipped in the image, per §1.3"
    provenance: {kind: documented, source: "Dockerfile COPY lines"}

host_side_effects:
  - {effect: child-processes, stance: absent, components: [auth, upload-relay, ops-endpoints, operator-tooling], conditions: "scan of pia/*.py and alembic/env.py at this version", provenance: {kind: maintainer, date: "2026-11"}}
  - {effect: signal-handlers, stance: absent, components: [auth, upload-relay, ops-endpoints, operator-tooling], conditions: "scan of pia/*.py and alembic/env.py at this version", provenance: {kind: maintainer, date: "2026-11"}}
  - {effect: filesystem, stance: conditional, components: [operator-tooling], conditions: "only pia sync / create-dt-projects read the curated file; nothing writes files", provenance: {kind: maintainer, date: "2026-11"}}
  - {effect: environment-reads, stance: conditional, components: [auth, upload-relay, ops-endpoints, operator-tooling], conditions: "PIA's own code reads only PIA_* variables; requests additionally honours proxy, CA-bundle and .netrc settings on PIA's behalf; the production image ships none", provenance: {kind: maintainer, date: "2026-11"}}
  - {effect: network-sockets, stance: present, components: [auth, upload-relay, operator-tooling], conditions: "HTTPS to the allowlisted issuer (GitHub, Eclipse GitLab or a registered Jenkins), the configured DependencyTrack URL, api.github.com and the gitlab.eclipse.org REST API (CLI only; GitLab anonymous; per-read timeouts), and PostgreSQL", provenance: {kind: maintainer, date: "2026-11"}}
  - {effect: global-state, stance: present, components: [auth, upload-relay, ops-endpoints], conditions: "import time in pia/main.py: logging record factory and basicConfig, Settings() load, Prometheus default registry", provenance: {kind: maintainer, date: "2026-11"}}

entry_points:
  - id: "POST /v1/upload/sbom"
    component: auth
    parameters:
      - name: Authorization header (Bearer JWT)
        attacker_controllable: true
        control_kinds: [data, serialized-state]
        caller_must_enforce: "none — P-SIG"
        provenance: {kind: documented, source: "DESIGN.md §4.1 request headers"}
      - name: unverified JWT iss claim
        attacker_controllable: true
        control_kinds: [resource-name]
        caller_must_enforce: "none — must be a printable string before the database lookup, else 401 (P-ERRORS); P-ISSUER-PIN"
        provenance: {kind: documented, source: "DESIGN.md §3.1.1 step 2; CHANGELOG 0.10.0 #125"}
      - name: JWT header kid and alg
        attacker_controllable: true
        control_kinds: [data, type-class]
        caller_must_enforce: "none — P-SIG"
        provenance: {kind: documented, source: "DESIGN.md §3.1.1 step 4 Verify signature using RSA256"}
      - name: verified claims (aud, exp, iat, repository, repository_owner_id, event_name)
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none — P-SIG, P-WORKLOAD-BIND; repository and repository_owner_id must be printable strings before the lookup (P-ERRORS)"
        provenance: {kind: documented, source: "DESIGN.md §3.1.1 steps 5–6"}
      - name: verified GitLab claims (project_path, project_id, pipeline_source)
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none — P-SIG, P-WORKLOAD-BIND; project_path and project_id must be printable strings before the lookup (P-ERRORS)"
        provenance: {kind: maintainer, date: "2026-11"}
      - name: Content-Type, malformed or non-UTF-8 body
        attacker_controllable: true
        control_kinds: [data, type-class]
        caller_must_enforce: "none — P-ERRORS"
        provenance: {kind: documented, source: "CHANGELOG 0.9.0 #110"}
      - name: OIDC discovery document (jwks_uri and the rest)
        attacker_controllable: true
        control_kinds: [data, size, resource-name]
        caller_must_enforce: "none — P-ISSUER-PIN, P-ISSUER-BOUND"
        provenance: {kind: documented, source: "DESIGN.md §3.1.1 step 3"}
      - name: JWKS document
        attacker_controllable: true
        control_kinds: [data, size, serialized-state]
        caller_must_enforce: "none — P-ISSUER-BOUND"
        provenance: {kind: documented, source: "DESIGN.md §3.1.1 step 3"}
  - id: "POST /v1/upload/sbom [body]"
    component: upload-relay
    parameters:
      - name: product_name
        attacker_controllable: true
        control_kinds: [resource-name]
        caller_must_enforce: "none — strict non-empty printable string, else 422 (P-ERRORS), so a registered name matches only if printable (register-printable-names); P-WORKLOAD-BIND"
        provenance: {kind: documented, source: "README authorization note"}
      - name: product_version, is_latest
        attacker_controllable: true
        control_kinds: [data]
        obligation_id: validate-sbom-at-dt
        caller_must_enforce: "strict types (non-empty printable string, boolean), else 422 (P-ERRORS); DependencyTrack validates; PIA relays verbatim (D-SBOM-VALIDATION)"
        provenance: {kind: documented, source: "DESIGN.md §3.1 step 6"}
      - name: bom (base64 CycloneDX)
        attacker_controllable: true
        control_kinds: [data, size]
        obligation_id: proxy-body-cap
        caller_must_enforce: "reverse proxy caps the request body; DependencyTrack validates content (D-SBOM-VALIDATION)"
        provenance: {kind: documented, source: "DESIGN.md §3.1 step 3"}
      - name: DependencyTrack response (status, body, token)
        attacker_controllable: false
        control_kinds: [data]
        caller_must_enforce: "none — relayed verbatim to the client (D-DT-RESPONSE)"
        provenance: {kind: documented, source: "DESIGN.md §4.1 Relay DependencyTrack status code and body verbatim"}
  - id: "any route"
    component: ops-endpoints
    parameters:
      - name: HTTP method, path, X-Request-ID header
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none — P-METRIC-CARD"
        provenance: {kind: documented, source: "DESIGN.md §5.4 Label cardinality; pia/main.py assign_request_id docstring"}
  - id: "GET /livez"
    component: ops-endpoints
    parameters:
      - name: query and headers (ignored)
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none — unused by the handler"
        provenance: {kind: documented, source: "DESIGN.md §4.1"}
  - id: "GET /metrics"
    component: ops-endpoints
    parameters:
      - name: query and headers (ignored)
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none — unused by the handler"
        provenance: {kind: documented, source: "DESIGN.md §4.1"}
  - id: "pia sync FILE"
    component: operator-tooling
    parameters:
      - name: curated YAML file
        attacker_controllable: false
        control_kinds: [data, serialized-state, resource-name]
        obligation_id: curate-authorization-file
        caller_must_enforce: "keep the curated file correct and canonical; review every sync plan"
        provenance: {kind: documented, source: "DESIGN.md §5.5 curated projects file"}
      - name: PIA_DATABASE_URL, PIA_DEPENDENCY_TRACK_API_KEY, PIA_GITHUB_TOKEN, --dt-url
        attacker_controllable: false
        control_kinds: [data, resource-name]
        obligation_id: protect-operator-secrets
        caller_must_enforce: "keep secrets out of logs and shell history"
        provenance: {kind: documented, source: "pia/cli.py module docstring"}
      - name: GitHub, Eclipse GitLab and DependencyTrack API responses
        attacker_controllable: false
        control_kinds: [data]
        caller_must_enforce: "none — trusted collaborator output (§1.10); a non-canonical GitLab path or a GitLab 404 (missing, private or internal project) aborts the sync"
        provenance: {kind: documented, source: "pia/sync.py build_desired and fetch_gitlab_project_id docstrings"}
  - id: "pia create-dt-projects FILE"
    component: operator-tooling
    parameters:
      - name: curated YAML file
        attacker_controllable: false
        control_kinds: [data, serialized-state, resource-name]
        obligation_id: curate-authorization-file
        caller_must_enforce: "keep the curated file correct and canonical; review every sync plan"
        provenance: {kind: documented, source: "DESIGN.md §5.5 curated projects file"}
      - name: PIA_DEPENDENCY_TRACK_API_KEY, --dt-url
        attacker_controllable: false
        control_kinds: [data, resource-name]
        obligation_id: protect-operator-secrets
        caller_must_enforce: "keep secrets out of logs and shell history"
        provenance: {kind: documented, source: "pia/cli.py module docstring"}
  - id: "alembic upgrade head"
    component: operator-tooling
    parameters:
      - name: PIA_DATABASE_URL and shipped migration scripts
        attacker_controllable: false
        control_kinds: [data, resource-name]
        obligation_id: run-migrations-out-of-band
        caller_must_enforce: "run with migration credentials, before rollout"
        provenance: {kind: documented, source: "README Database Migration"}
  - id: "app start"
    component: auth
    parameters:
      - name: PIA_* settings
        attacker_controllable: false
        control_kinds: [data, resource-name]
        obligation_id: configure-per-1.6
        caller_must_enforce: "set per §1.6"
        provenance: {kind: documented, source: "DESIGN.md §4.2"}

contract_dimensions:
  - {component: auth, dimension: numeric-domain, status: claimed, conditions: "issuer responses ≤ 1 MiB decoded; exp/iat checked as numbers; iss must be a printable string before the database lookup", property_id: P-ISSUER-BOUND, provenance: {kind: documented, source: "DESIGN.md §3.1.1 step 3; CHANGELOG 0.9.0 #109"}}
  - {component: auth, dimension: failure-atomicity, status: not-applicable, conditions: "no state is mutated; every request is independent and the database is read-only for the app", provenance: {kind: documented, source: "README runtime database user only needs read access"}}
  - {component: auth, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "inputs are flat JSON documents; nesting depth is the runtime JSON parser's contract (§1.9)", provenance: {kind: documented, source: "DESIGN.md §5.1 PyJWT entry"}}
  - {component: auth, dimension: callback-execution, status: claimed, conditions: "the issuer's jwks_uri is followed only under the issuer URL; no redirects", property_id: P-ISSUER-PIN, provenance: {kind: documented, source: "CHANGELOG 0.9.0 #113"}}
  - {component: auth, dimension: serialization-reconstruction, status: claimed, conditions: "JWT and JWKS parsed by PyJWT as JSON; keys reconstructed as RSA public keys used only to verify RS256", property_id: P-SIG, provenance: {kind: documented, source: "DESIGN.md §3.1.1 step 4"}}
  - {component: auth, dimension: reference-lifecycle, status: disclaimed, conditions: "a token is accepted any number of times until exp; no jti tracking", property_id: D-REPLAY, provenance: {kind: documented, source: "DESIGN.md §10 Protect against replayed tokens"}}
  - {component: auth, dimension: concurrency-reentrancy, status: claimed, conditions: "a slow issuer holds one threadpool worker; about 40 concurrent slow requests exhaust the pool", property_id: P-NO-STALL, provenance: {kind: documented, source: "PR #112 description About 40 such requests"}}
  - {component: auth, dimension: resource-complexity, status: disclaimed, conditions: "per request up to two outbound fetches, each 10 s per read and 1 MiB; no cap on request volume and no bound on total time against a trickling issuer", property_id: D-RATE-LIMIT, provenance: {kind: documented, source: "DESIGN.md §8.3 rate limiting at the reverse proxy; §10 slow retrieval"}}
  - {component: upload-relay, dimension: numeric-domain, status: disclaimed, conditions: "no length cap on bom, product_name or product_version; the binding limits are DependencyTrack's 20,000,000-character cap and the proxy's body limit; the two name fields must only be non-empty and printable", property_id: D-SBOM-VALIDATION, provenance: {kind: maintainer, date: "2026-11"}}
  - {component: upload-relay, dimension: failure-atomicity, status: disclaimed, conditions: "a 500 or 502 does not mean the SBOM was not stored; retry may duplicate it", property_id: D-EXTERNAL-ATOMICITY, provenance: {kind: documented, source: "pia/main.py upload_sbom comment a retry is NOT safe"}}
  - {component: upload-relay, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "the body schema is four flat fields; the SBOM is an opaque string", provenance: {kind: documented, source: "DESIGN.md §4.1 request body"}}
  - {component: upload-relay, dimension: callback-execution, status: disclaimed, conditions: "DependencyTrack's response is relayed verbatim; PIA does not sanitize it", property_id: D-DT-RESPONSE, provenance: {kind: documented, source: "DESIGN.md §4.1 verbatim"}}
  - {component: upload-relay, dimension: serialization-reconstruction, status: claimed, conditions: "the SBOM is never decoded or parsed by PIA", property_id: P-SBOM-OPAQUE, provenance: {kind: documented, source: "DESIGN.md §3.1 step 3"}}
  - {component: upload-relay, dimension: reference-lifecycle, status: claimed, conditions: "the target project is resolved per request from the database; a pia sync change applies to the next request; a GitLab workload matches only the project_id recorded at sync, so a project re-created at a registered path is rejected until re-synced", property_id: P-WORKLOAD-BIND, provenance: {kind: documented, source: "DESIGN.md §3.1 step 5; pia/models.py GitLabWorkload docstring resurrection guard"}}
  - {component: upload-relay, dimension: concurrency-reentrancy, status: claimed, conditions: "the DependencyTrack call has connect/read timeouts and runs in the threadpool", property_id: P-NO-STALL, provenance: {kind: documented, source: "pia/dependencytrack.py TIMEOUT docstring"}}
  - {component: upload-relay, dimension: resource-complexity, status: disclaimed, conditions: "the whole body, its parse, and the base64 string sit in memory at once", property_id: D-SBOM-VALIDATION, provenance: {kind: documented, source: "issue #111 Memory in PIA"}}
  - {component: ops-endpoints, dimension: numeric-domain, status: claimed, conditions: "every label value comes from a fixed set, a route template, or a database row", property_id: P-METRIC-CARD, provenance: {kind: documented, source: "DESIGN.md §5.4 Label cardinality"}}
  - {component: ops-endpoints, dimension: failure-atomicity, status: not-applicable, conditions: "counters only increment; no transactional state", provenance: {kind: documented, source: "pia/metrics.py module docstring"}}
  - {component: ops-endpoints, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "no structured input", provenance: {kind: documented, source: "DESIGN.md §4.1"}}
  - {component: ops-endpoints, dimension: callback-execution, status: not-applicable, conditions: "no collaborator; /livez is static and /metrics reads process memory", provenance: {kind: documented, source: "pia/main.py livez docstring"}}
  - {component: ops-endpoints, dimension: serialization-reconstruction, status: not-applicable, conditions: "output only (text exposition)", provenance: {kind: documented, source: "DESIGN.md §4.1"}}
  - {component: ops-endpoints, dimension: reference-lifecycle, status: claimed, conditions: "one request ID per request, generated server-side, reset after the request", property_id: P-LOG-ESCAPE, provenance: {kind: documented, source: "pia/main.py assign_request_id docstring"}}
  - {component: ops-endpoints, dimension: concurrency-reentrancy, status: claimed, conditions: "handlers are async and do no blocking I/O, so they answer while the threadpool is busy", property_id: P-NO-STALL, provenance: {kind: documented, source: "CHANGELOG 0.9.0 no longer stalls all other requests"}}
  - {component: ops-endpoints, dimension: resource-complexity, status: claimed, conditions: "registry size is bounded by label cardinality; /metrics is unauthenticated but not routed publicly (D-METRICS-AUTH)", property_id: P-METRIC-CARD, provenance: {kind: documented, source: "DESIGN.md §4.1 and §5.4"}}
  - {component: operator-tooling, dimension: numeric-domain, status: disclaimed, conditions: "no limits on file size, project count, or API response size", property_id: D-CLI-BOUNDS, provenance: {kind: documented, source: "DESIGN.md §5.5 states no limits"}}
  - {component: operator-tooling, dimension: failure-atomicity, status: claimed, conditions: "pia sync applies its plan in one transaction and commits at the end; create-dt-projects is idempotent but not atomic (D-EXTERNAL-ATOMICITY)", property_id: P-SYNC-ATOMIC, provenance: {kind: documented, source: "pia/sync.py apply_plan docstring; pia/cli.py create_dt_projects help Idempotent"}}
  - {component: operator-tooling, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "the file schema is two levels deep with extra=forbid", provenance: {kind: documented, source: "pia/sync.py module docstring file example"}}
  - {component: operator-tooling, dimension: callback-execution, status: not-applicable, conditions: "GitHub, Eclipse GitLab and DependencyTrack are trusted collaborators whose answers are taken as true (§1.10)", provenance: {kind: documented, source: "pia/sync.py build_desired docstring"}}
  - {component: operator-tooling, dimension: serialization-reconstruction, status: not-applicable, conditions: "the file is operator-trusted and loaded with yaml.safe_load, which constructs no arbitrary objects", provenance: {kind: documented, source: "DESIGN.md §5.5 curated"}}
  - {component: operator-tooling, dimension: reference-lifecycle, status: claimed, conditions: "rows are keyed by their business columns; a changed row is a delete plus a create", property_id: P-SYNC-ATOMIC, provenance: {kind: documented, source: "pia/sync.py compute_plan docstring"}}
  - {component: operator-tooling, dimension: concurrency-reentrancy, status: disclaimed, conditions: "no lock between concurrent pia sync runs", property_id: D-CLI-BOUNDS, provenance: {kind: documented, source: "DESIGN.md §5.5 makes no concurrency statement"}}
  - {component: operator-tooling, dimension: resource-complexity, status: disclaimed, conditions: "GitHub, Eclipse GitLab and DependencyTrack calls have 5 s connect and 30 s per-read timeouts but no total deadline; interactive use", property_id: D-CLI-BOUNDS, provenance: {kind: documented, source: "pia/sync.py TIMEOUT docstring not the total request time"}}

outputs:
  - component: upload-relay
    channel: dependencytrack-upload-request
    taint: same-as-input
    taint_provenance: {kind: documented, source: "DESIGN.md §3.1 step 6"}
    invariants:
      - id: sbom-relayed-byte-identical
        statement: "the bom string reaches DependencyTrack byte-identical and undecoded"
        property_id: P-SBOM-OPAQUE
        provenance: {kind: documented, source: "DESIGN.md §3.1 step 3"}
    downstream_must_not_assume:
      - id: sbom-well-formed
        statement: "the SBOM is well-formed CycloneDX, the version string is sane, or the name was vetted beyond matching a registered product"
        provenance: {kind: documented, source: "DESIGN.md §3.1 step 6"}
  - component: upload-relay
    channel: polling-url
    taint: constrained
    taint_provenance: {kind: documented, source: "pia/main.py upload_sbom polling_url assembly"}
    invariants: []
    downstream_must_not_assume:
      - id: polling-url-reachable
        statement: "the polling URL is reachable from outside the cluster"
        provenance: {kind: documented, source: "issue #66 polling_url should be externally reachable"}
  - component: upload-relay
    channel: relayed-dependencytrack-error
    taint: same-as-input
    taint_provenance: {kind: documented, source: "DESIGN.md §4.1 Relay DependencyTrack status code and body verbatim"}
    invariants: []
    downstream_must_not_assume:
      - id: dt-error-body-is-json
        statement: "the relayed body is JSON, or free of content echoed from the SBOM"
        provenance: {kind: documented, source: "DESIGN.md §4.1 verbatim"}
  - component: auth
    channel: error-responses-401-422-502-500
    taint: constrained
    taint_provenance: {kind: documented, source: "DESIGN.md §4.1 response list; PR #99 description nothing to withhold"}
    invariants: []
    downstream_must_not_assume:
      - id: 401-reason-granularity
        statement: "a 401 distinguishes unknown issuer from unregistered workload beyond the stated reason strings"
        provenance: {kind: documented, source: "DESIGN.md §4.1 response list"}
      - id: 401-hides-registered-issuer
        statement: "the 401 reason hides whether a Jenkins issuer URL is registered (D-ISSUER-ENUMERATION)"
        provenance: {kind: maintainer, date: "2026-07"}
  - component: ops-endpoints
    channel: x-request-id-header
    taint: constrained
    taint_provenance: {kind: documented, source: "pia/main.py assign_request_id docstring"}
    invariants:
      - id: request-id-server-generated
        statement: "the request ID is 16 server-generated hex characters, never taken from the request"
        property_id: P-LOG-ESCAPE
        provenance: {kind: documented, source: "pia/main.py assign_request_id docstring"}
    downstream_must_not_assume:
      - id: request-id-correlates-inbound
        statement: "the response ID correlates with an inbound X-Request-ID header"
        provenance: {kind: documented, source: "pia/main.py assign_request_id docstring"}
  - component: auth
    channel: log-lines
    taint: sanitized
    taint_provenance: {kind: documented, source: "pia/main.py LOGGED_CLAIMS and _claims_summary docstrings"}
    invariants:
      - id: caller-text-escaped-in-logs
        statement: "pre-authentication caller values are ASCII-escaped; the bearer token and API key never appear"
        property_id: P-LOG-ESCAPE
        provenance: {kind: documented, source: "CHANGELOG 0.3.0 #60"}
      - id: authed-caller-text-escaped-in-logs
        statement: "post-authentication caller values are ASCII-escaped and each line names the caller's real ef_project_id"
        property_id: P-LOG-ESCAPE-AUTHED
        provenance: {kind: maintainer, date: "2026-10"}
    downstream_must_not_assume:
      - id: logs-free-of-attacker-text
        statement: "a log line is free of attacker-chosen text; it is escaped, not absent"
        provenance: {kind: documented, source: "pia/main.py _claims_summary docstring"}
  - component: ops-endpoints
    channel: metrics-text-exposition
    taint: constrained
    taint_provenance: {kind: documented, source: "DESIGN.md §5.4 Label cardinality"}
    invariants:
      - id: no-raw-request-value-as-label
        statement: "label values are fixed sets, route templates, or database rows; never raw request input"
        property_id: P-METRIC-CARD
        provenance: {kind: documented, source: "DESIGN.md §5.4 Label cardinality"}
    downstream_must_not_assume:
      - id: metrics-private
        statement: "the endpoint is private unless the ingress keeps it so"
        provenance: {kind: documented, source: "DESIGN.md §4.1"}
  - component: operator-tooling
    channel: cli-stdout-plan
    taint: constrained
    taint_provenance: {kind: documented, source: "pia/sync.py format_plan docstring"}
    invariants: []
    downstream_must_not_assume: []
  - component: operator-tooling
    channel: database-rows
    taint: constrained
    taint_provenance: {kind: documented, source: "pia/models.py comment the curated file is the only writer"}
    invariants: []
    downstream_must_not_assume:
      - id: rows-written-elsewhere-coherent
        statement: "rows written by anything other than pia sync are coherent"
