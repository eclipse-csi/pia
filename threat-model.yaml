    capabilities: [create-repositories-under-registered-owner, recreate-deleted-or-renamed-repository, push-run-schedule-or-include-ci-in-registered-gitlab-project, create-api-pipelines-in-registered-gitlab-project, hold-access-token-with-insider-role, trigger-allowlisted-publish-events]
