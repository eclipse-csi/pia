build_policy:
  security_relevant_flags_present: true
  provenance: {kind: documented, source: "DESIGN.md §4.2 Settings"}

build_flags:
  - name: PIA_EXPECTED_AUDIENCE
    default: "pia.eclipse.org"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - {property_id: P-SIG, effect: preserves}
    provenance: {kind: documented, source: "DESIGN.md §4.2 and §7.2 Set audience, to prevent cross-service token replay"}
  - name: PIA_DEPENDENCY_TRACK_URL-http-scheme
    default: "https://sbom.eclipse.org/api/v1/bom"
    security_relevant: true
    maintainer_stance: dev-only
    affects_properties:
      - {property_id: P-OUTBOUND-TLS, effect: voids}
    provenance: {kind: maintainer, date: "2026-11"}
  - name: PIA_DATABASE_URL-without-sslmode
    default: "none (required)"
    security_relevant: false
    maintainer_stance: supported
    affects_properties: []
    provenance: {kind: maintainer, date: "2026-11"}
  - name: uvicorn--workers
    default: "1"
    security_relevant: false
    maintainer_stance: unsupported
    affects_properties: []
    provenance: {kind: documented, source: "DESIGN.md §5.4 Single worker"}
  - name: uvicorn--reload-and-migrations-on-start
    default: "off"
    security_relevant: false
    maintainer_stance: dev-only
    affects_properties: []
    provenance: {kind: documented, source: "docker-compose.yml comments"}
  - name: pia-sync--allow-db-updates-and-deletions
    default: "off"
    security_relevant: false
    maintainer_stance: supported
    affects_properties: []
    provenance: {kind: documented, source: "pia/cli.py option help Explicit intent is required"}

properties_claimed:
  - {id: P-SIG, kind: authentication, components: [auth], tier: security-critical, conditions: "RS256 only; key fetched per request from the allowlisted issuer's JWKS, kid match, use sig or absent; aud equals PIA_EXPECTED_AUDIENCE; exp unexpired; iat present", violation_symptoms: [integrity-bypass], provenance: {kind: documented, source: "DESIGN.md §3.1.1 steps 3–4"}}
  - {id: P-ISSUER-PIN, kind: x-outbound-confinement, components: [auth], tier: security-critical, conditions: "iss equals the GitHub issuer, the Eclipse GitLab issuer, or a registered Jenkins issuer; jwks_uri under {iss}/ with unreserved characters and no dot segments; no redirects; HTTP 200 only", violation_symptoms: [x-outbound-request-to-unlisted-host], provenance: {kind: documented, source: "DESIGN.md §3.1.1 steps 2–3; CHANGELOG 0.6.0 #84 and 0.9.0 #113"}}
  - {id: P-ISSUER-BOUND, kind: resource-bound, components: [auth], tier: security-critical, conditions: "each discovery and JWKS response: 10 s per read, 1 MiB decoded cap, 10 s deadline checked between reads; total wall time is not bounded (D-SLOW-RETRIEVAL)", violation_symptoms: [unbounded-allocation], provenance: {kind: documented, source: "DESIGN.md §3.1.1 step 3"}}
  - {id: P-WORKLOAD-BIND, kind: integrity, components: [auth, upload-relay], tier: security-critical, conditions: "verified claims match exactly one registered workload; GitHub event_name a string in {push, workflow_dispatch, release, schedule}; GitLab matched on project_path and project_id (never job_project_*), so fork MR pipelines never match and a project re-created at a registered path is rejected until re-synced, against insiders too (maintainer 2026-11); GitLab pipeline_source a string in {push, web, schedule, api}; product_name resolved only within the workload's ef_project_id; registrations are operator input", violation_symptoms: [integrity-bypass], provenance: {kind: documented, source: "README authorization note; DESIGN.md §3.1.1 steps 5–6 and §4.3; pia/models.py find_workload_by_claims comment, GITLAB_ALLOWED_PIPELINE_SOURCES and GitLabWorkload docstrings"}}
  - {id: P-NO-STALL, kind: availability, components: [auth, upload-relay, ops-endpoints], tier: security-critical, conditions: "fewer than about 40 concurrent slow requests; DependencyTrack call has 5 s connect and 30 s read timeouts", violation_symptoms: [hang], provenance: {kind: documented, source: "CHANGELOG 0.9.0 #112; PR #112 description"}}
  - {id: P-LOG-ESCAPE, kind: output-sanitization, components: [auth, ops-endpoints], tier: security-critical, conditions: "values logged before the signature check passes (unverified iss, decode and verification errors) are escaped with !a; request ID server-generated; token and API key never logged", violation_symptoms: [x-log-forgery, info-leak], provenance: {kind: documented, source: "CHANGELOG 0.3.0 #60"}}
  - {id: P-LOG-ESCAPE-AUTHED, kind: output-sanitization, components: [auth, upload-relay], tier: correctness-only, conditions: "values logged after a token verified for a registered workload (claims summary, product_name, product_version, DependencyTrack body) are escaped with !a; the fixed line text names the caller's real ef_project_id", violation_symptoms: [x-log-forgery], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: P-ERRORS, kind: correctness, components: [auth, upload-relay], tier: correctness-only, conditions: "malformed POST data (wrong JSON type, empty or non-printable product_name/product_version) yields 422 without echoing the body; token problems, including a malformed iss or workload-matching claims that are not printable strings or a non-string event_name or pipeline_source, yield 401; DependencyTrack failure yields 502 or the relayed status; unprintable text (NUL, lone surrogates, other control characters) never reaches a database query, before or after authentication (maintainer 2026-11); an unhandled 500 on malformed unauthenticated input is a bug, not a vulnerability (maintainer ruling 2026-10)", violation_symptoms: [crash], provenance: {kind: documented, source: "DESIGN.md §5.3; CHANGELOG 0.9.0 #109, #110; CHANGELOG 0.10.0 #125"}}
  - {id: P-METRIC-CARD, kind: resource-bound, components: [ops-endpoints], tier: security-critical, conditions: "method collapses to a fixed set, path is the route template or <unmatched>, reason/outcome are Literal, product_name labeled only after resolving to a database row", violation_symptoms: [unbounded-allocation], provenance: {kind: documented, source: "DESIGN.md §5.4 Label cardinality"}}
  - {id: P-OUTBOUND-TLS, kind: confidentiality, components: [auth, upload-relay, operator-tooling], tier: security-critical, conditions: "issuer URLs and the CLI's GitHub and GitLab API URLs are HTTPS by construction; requests verifies certificates by default; DependencyTrack URL is https (an http URL is dev-only, §1.6)", violation_symptoms: [info-leak], provenance: {kind: maintainer, date: "2026-11"}}
  - {id: P-SBOM-OPAQUE, kind: correctness, components: [upload-relay], tier: correctness-only, conditions: "bom relayed byte-identical and never decoded", violation_symptoms: [wrong-output], provenance: {kind: documented, source: "DESIGN.md §3.1 step 3"}}
  - {id: P-SYNC-ATOMIC, kind: correctness, components: [operator-tooling], tier: correctness-only, conditions: "pia sync prints its plan, refuses deletions/updates without --allow-db-updates-and-deletions, applies in one transaction, commits once; validator rejects duplicate ids, workload URLs and DependencyTrack names; a non-canonical GitLab project path aborts the sync", violation_symptoms: [x-partial-authorization-state], provenance: {kind: documented, source: "pia/cli.py sync help; DESIGN.md §5.5"}}

properties_disclaimed:
  - {id: D-REPLAY, components: [auth], conditions: "within the token's lifetime; no jti tracking; stated limit, not silence", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "issue #9; DESIGN.md §10 Protect against replayed tokens"}}
  - {id: D-SLOW-RETRIEVAL, components: [auth], conditions: "requires control of a registered issuer; availability only; accepted risk; the 10 s TIMEOUT is per read, not a total deadline", tier: security-critical, false_friend: true, provenance: {kind: documented, source: "DESIGN.md §10 PIA currently does not prevent slow retrieval attacks; PR #112 description accepted risk"}}
  - {id: D-RATE-LIMIT, components: [auth, upload-relay, ops-endpoints], conditions: "the reverse proxy owns rate limiting; every unauthenticated request may cost two outbound fetches and a database query", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "DESIGN.md §8.1 Reverse proxy for TLS termination and rate limiting; §8.3 Rate limiting per project/IP at reverse proxy level"}}
  - {id: D-SBOM-VALIDATION, components: [upload-relay], conditions: "authenticated workloads; PIA checks only that product_name and product_version are non-empty printable strings; it caps no field length and never parses or validates bom, including NUL or lone-surrogate escapes inside it; DependencyTrack and the proxy do", tier: security-critical, false_friend: true, provenance: {kind: maintainer, date: "2026-11"}}
  - {id: D-PRODUCT-LEAST-PRIV, components: [auth, upload-relay], conditions: "within one EF project; any registered workload may publish to every product of that EF project", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "README authorization note; issue #39 decision Option A"}}
  - {id: D-EVENT-SEMANTICS, components: [auth], conditions: "maintainer-triggered events in a registered repository: only event_name is checked, not ref, workflow file, actor, environment or SHA; committer-caused pipelines in a registered GitLab project: only pipeline_source is checked, not ref, ref_protected, environment, ci_config_ref_uri, sub or the requesting job, and jobs from included CI files may publish", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "DESIGN.md §3.1.1 step 6 lists the one check; pia/main.py LOGGED_CLAIMS docstring"}}
  - {id: D-JENKINS-JOB, components: [auth], conditions: "registered Jenkins instances; any job that can bind the id-token credential; sub is not checked", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "DESIGN.md §7.2 No additional claims required; §3.1.1 Jenkins: no additional checks"}}
  - {id: D-ISSUER-TRUST-ROOT, components: [auth], conditions: "the compromised or faulty issuer's own workloads only, including signed claims that contradict the issuer's own documentation (e.g. GitLab naming the parent in a fork MR token, maintainer 2026-11); cross-issuer substitution is covered by P-ISSUER-PIN; PIA matching a claim its issuer documents differently is VALID against P-WORKLOAD-BIND", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "DESIGN.md §2.2 items 1–2"}}
  - {id: D-INBOUND-TLS, components: [auth, upload-relay, ops-endpoints], conditions: "a deployment that exposes port 8000 without the proxy owns the exposure", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "DESIGN.md §8.1; Dockerfile CMD"}}
  - {id: D-METRICS-AUTH, components: [ops-endpoints], conditions: "the ingress keeps /metrics private; exposes EF project ids, product names, upload counts and version", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "DESIGN.md §4.1 served on the application port and unauthenticated"}}
  - {id: D-DT-RESPONSE, components: [upload-relay], conditions: "non-2xx answers from DependencyTrack are relayed verbatim", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "DESIGN.md §4.1 verbatim"}}
  - {id: D-EXTERNAL-ATOMICITY, components: [upload-relay, operator-tooling], conditions: "a 500 after a 2xx from DependencyTrack means the SBOM was likely stored; create-dt-projects may stop halfway, re-run is idempotent", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "pia/main.py upload_sbom comment a retry is NOT safe; pia/cli.py create_dt_projects help"}}
  - {id: D-ATTESTATION, components: [upload-relay], conditions: "DependencyTrack receives the SBOM under PIA's key with no record of which workload sent it; an authenticated upload is not an attested SBOM", tier: correctness-only, false_friend: true, provenance: {kind: documented, source: "DESIGN.md §3.1 step 6 lists every field sent to DependencyTrack"}}
  - {id: D-LIVEZ-STATIC, components: [ops-endpoints], conditions: "/livez returns a constant and does not check the database", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "pia/main.py livez docstring; issue #96"}}
  - {id: D-ISSUER-ENUMERATION, components: [auth], conditions: "Jenkins issuer URLs only; the 401 reason reveals whether an issuer is registered before any signature check; accepted because the information is not sensitive", tier: correctness-only, false_friend: false, provenance: {kind: maintainer, date: "2026-07"}}
  - {id: D-DB-TRANSPORT, components: [auth, upload-relay, ops-endpoints, operator-tooling], conditions: "a deliberate limit confirmed by the maintainers; PIA passes PIA_DATABASE_URL through unchanged; TLS is whatever the URL says", tier: security-critical, false_friend: false, provenance: {kind: maintainer, date: "2026-11"}}
  - {id: D-CLI-BOUNDS, components: [operator-tooling], conditions: "absence-based except the stated per-read timeout; interactive operator use; GitHub, Eclipse GitLab and DependencyTrack calls in pia sync have 5 s connect and 30 s per-read timeouts but no total deadline; concurrent runs are not serialized", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "DESIGN.md §5.5 makes no such statement; pia/sync.py TIMEOUT docstring"}}

downstream_responsibilities:
  - {id: proxy-in-front, component: auth, statement: "keep a reverse proxy in front that terminates TLS, rate-limits, and caps the request body", enforces: [D-RATE-LIMIT, D-INBOUND-TLS, proxy-body-cap], provenance: {kind: documented, source: "DESIGN.md §8.1; issue #111"}}
  - {id: private-metrics, component: ops-endpoints, statement: "do not route /metrics publicly", enforces: [D-METRICS-AUTH, metrics-private], provenance: {kind: documented, source: "DESIGN.md §4.1"}}
  - {id: https-dependencytrack-url, component: upload-relay, statement: "use an https:// DependencyTrack URL in production", enforces: [P-OUTBOUND-TLS], provenance: {kind: maintainer, date: "2026-11"}}
  - {id: register-printable-names, component: operator-tooling, statement: "register printable DependencyTrack product names; PIA rejects a product_name with control or format characters or a separator other than the ASCII space with 422, so such a name can never receive an upload", enforces: [curate-authorization-file], provenance: {kind: maintainer, date: "2026-11"}}
  - {id: database-transport-tls, component: operator-tooling, statement: "use a database URL with TLS where the network is not trusted", enforces: [D-DB-TRANSPORT], provenance: {kind: maintainer, date: "2026-11"}}
  - {id: scope-dependencytrack-api-key, component: upload-relay, statement: "scope the DependencyTrack API key to what each caller needs and rotate it", enforces: [protect-operator-secrets], provenance: {kind: documented, source: "pia/cli.py module docstring"}}
  - {id: separate-migration-credentials, component: operator-tooling, statement: "run migrations as a separate job with migration credentials; give the app a read-only database user", enforces: [run-migrations-out-of-band], provenance: {kind: documented, source: "README Database Migration"}}
  - {id: curate-the-file, component: operator-tooling, statement: "treat the curated file as the authorization policy: review every plan with --dry-run first, keep repository URLs canonical and each repository under exactly one EF project, re-sync after a DependencyTrack rename", enforces: [curate-authorization-file, P-SYNC-ATOMIC], provenance: {kind: documented, source: "DESIGN.md §5.5; issue #107; issue #87"}}
  - {id: resync-gitlab-changes, component: operator-tooling, statement: "re-sync after a registered GitLab project is renamed, transferred, or deleted and re-created", enforces: [curate-authorization-file, P-WORKLOAD-BIND], provenance: {kind: documented, source: "pia/models.py GitLabWorkload docstring until it is re-synced"}}
  - {id: audience-per-deployment, component: auth, statement: "set PIA_EXPECTED_AUDIENCE to a deployment-unique value and configure every issuer's token request with it", enforces: [P-SIG], provenance: {kind: documented, source: "DESIGN.md §7.1–§7.2"}}
  - {id: restrict-jenkins-jobs, component: auth, statement: "register a Jenkins instance only if everyone who can define jobs on it may publish for that EF project", enforces: [D-JENKINS-JOB], provenance: {kind: documented, source: "DESIGN.md §7.2 Set GLOBAL scope"}}
  - {id: clean-pod-environment, component: auth, statement: "keep the pod environment free of proxy, CA-bundle and .netrc settings you do not intend requests to honour", enforces: [P-ISSUER-PIN], provenance: {kind: maintainer, date: "2026-11"}}
  - {id: single-worker, component: ops-endpoints, statement: "run one uvicorn worker per container; scale by pods", enforces: [P-METRIC-CARD], provenance: {kind: documented, source: "DESIGN.md §5.4"}}
  - {id: trusted-workflow-code, component: auth, statement: "keep workflows on push, workflow_dispatch, release or schedule free of untrusted code", enforces: [D-EVENT-SEMANTICS], provenance: {kind: documented, source: "pia/models.py GITHUB_ALLOWED_EVENT_NAMES docstring"}}
  - {id: gitlab-pipeline-access-is-a-credential, component: auth, statement: "on Eclipse GitLab, treat Developer access to a registered project (push, Run pipeline, Pipelines API, schedules) like a credential; keep the publishing job small, limit it to release refs with rules:, protect those refs, and consider a protected environment with required approvals", enforces: [D-EVENT-SEMANTICS], provenance: {kind: maintainer, date: "2026-11"}}
  - {id: gitlab-api-token-is-a-credential, component: auth, statement: "treat any token that can create api pipelines in a registered GitLab project as an SBOM-publishing credential, especially one held outside GitLab; least scope, shortest lifetime, stored like a release credential", enforces: [D-EVENT-SEMANTICS], provenance: {kind: maintainer, date: "2026-11"}}
  - {id: token-handling, component: auth, statement: "treat the ID token as a credential for its lifetime; do not print it; expect no replay protection", enforces: [D-REPLAY], provenance: {kind: documented, source: "DESIGN.md §10 Protect against replayed tokens"}}
  - {id: poll-dont-retry, component: upload-relay, statement: "poll the returned polling_url; a 200 means accepted, not processed; do not retry a 500 blindly", enforces: [D-EXTERNAL-ATOMICITY, polling-url-reachable], provenance: {kind: documented, source: "DESIGN.md §4.1; pia/main.py upload_sbom comment"}}
  - {id: dependencytrack-validates-sbom, component: upload-relay, statement: "DependencyTrack validates the SBOM; PIA forwards whatever the workload sent", enforces: [validate-sbom-at-dt, sbom-well-formed], provenance: {kind: documented, source: "DESIGN.md §3.1 step 6"}}

known_misuses:
  - {id: allowlisted-event-untrusted-code, components: [auth], pattern: "a workflow_dispatch or push workflow checks out and runs pull-request code, giving it a token PIA accepts", safer_alternative: "keep publishing workflows free of untrusted inputs", provenance: {kind: documented, source: "pia/models.py GITHUB_ALLOWED_EVENT_NAMES docstring"}}
  - {id: name-based-repository-identity, components: [auth], pattern: "a deleted or renamed repository's name is re-created under the same owner and inherits the registration", safer_alternative: "treat repo deletion or rename as a pia sync event; repository_id matching is planned as hardening", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: case-variant-duplicate-registrations, components: [operator-tooling], pattern: "two spellings of one repository registered under two EF projects", safer_alternative: "keep URLs canonical", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: pod-exposed-without-proxy, components: [auth, upload-relay, ops-endpoints], pattern: "exposing port 8000 directly: plain HTTP, no rate limit, no body cap", safer_alternative: "deploy behind the reverse proxy per §1.13", provenance: {kind: documented, source: "DESIGN.md §8.1"}}
  - {id: over-privileged-dependencytrack-key, components: [upload-relay], pattern: "treating the DependencyTrack API key as per-project; a portfolio-management key in the app pod", safer_alternative: "scope the key per caller", provenance: {kind: documented, source: "pia/cli.py module docstring"}}
  - {id: retrying-a-500, components: [upload-relay], pattern: "retrying an upload after a 500 when the SBOM may already be stored", safer_alternative: "poll DependencyTrack for the version before re-sending", provenance: {kind: documented, source: "pia/main.py upload_sbom comment"}}
  - {id: multiple-uvicorn-workers, components: [ops-endpoints], pattern: "running uvicorn with --workers so metrics become per-worker and wrong", safer_alternative: "scale by pods", provenance: {kind: documented, source: "DESIGN.md §5.4"}}

known_non_findings:
  - {id: KNF-UNVERIFIED-DECODE, symptom: integrity-bypass, components: [auth], tool_pattern: "JWT decoded with verify_signature=False in pia/main.py authenticate", conditions: "the unverified claims are used only to select the issuer allowlist row; every authorization decision uses the claims returned by the verifying decode", discharged_by: [P-SIG], provenance: {kind: documented, source: "pia/main.py authenticate comment Pre-verification check"}}
  - {id: KNF-RATE-LIMIT, symptom: x-volumetric-dos, components: [auth, upload-relay, ops-endpoints], tool_pattern: "no rate limiting on /v1/upload/sbom; each request triggers outbound fetches", conditions: "the report shows only request volume, not a per-request bound being exceeded", discharged_by: [D-RATE-LIMIT], provenance: {kind: documented, source: "DESIGN.md §8.1"}}
  - {id: KNF-SLOW-ISSUER, symptom: x-worker-exhaustion, components: [auth], tool_pattern: "slow or trickling issuer holds a worker beyond 10 s", conditions: "the slow party is a registered issuer, and the event loop and /livez keep serving", discharged_by: [D-SLOW-RETRIEVAL], provenance: {kind: documented, source: "PR #112 description Known limitation (accepted risk)"}}
  - {id: KNF-METRIC-LABELS, symptom: unbounded-allocation, components: [ops-endpoints], tool_pattern: "request method or path used as a Prometheus label", conditions: "the value passes through method_label, the route template, a Literal, or a database row before labeling", discharged_by: [P-METRIC-CARD], provenance: {kind: documented, source: "DESIGN.md §5.4 Label cardinality"}}
  - {id: KNF-REPLAY, symptom: x-token-replay, components: [auth], tool_pattern: "a valid token can be reused within its lifetime", conditions: "the replayed token is unexpired and the report shows no acceptance past exp", discharged_by: [D-REPLAY], provenance: {kind: documented, source: "DESIGN.md §10 Protect against replayed tokens"}}

